name: Validate Login The Moon

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - name: Build static site
        env:
          NEXT_PUBLIC_BASE_PATH: /Login-The-Moon
        run: npm run build
      - run: npm run typecheck
      - run: npm audit --omit=dev --audit-level high
      - run: npm run audit:dev
